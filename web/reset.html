<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — Matra7</title>
    <link rel="icon" href="/assets/logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body class="bridge">
    <main class="bridge-card">
      <img class="logo" src="/assets/logo-mark.png" alt="Matra7" width="160" height="54" />
      <h1 id="title">Back to the app</h1>
      <p id="body">Open Matra7 to choose a new password.</p>
      <a class="btn" id="open" href="sakanat://reset-password">Open the app</a>
    </main>
    <script>
      (function () {
        var query = location.search || '';
        var hash = location.hash || '';
        var deep = 'sakanat://reset-password' + query + hash;
        document.getElementById('open').setAttribute('href', deep);
        var params = new URLSearchParams(query + hash.replace('#', '&'));
        if (params.get('error') || params.get('error_description')) {
          document.getElementById('title').textContent = 'Could not open link';
          document.getElementById('body').textContent =
            params.get('error_description') || 'Request a new link from the app.';
          return;
        }
        setTimeout(function () {
          location.href = deep;
        }, 800);
      })();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — Matra7</title>
    <link rel="icon" href="/assets/logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body class="bridge">
    <main class="bridge-card">
      <img class="logo" src="/assets/logo-mark.png" alt="Matra7" width="160" height="54" />
      <h1 id="title">Choose a new password</h1>
      <p id="body">Type it twice. When this page says the password is updated, sign in to Matra7 with it.</p>
      <form id="form" class="bridge-form" hidden>
        <label>
          <span id="label-password">New password</span>
          <span class="bridge-pass">
            <input id="password" type="password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" dir="ltr" />
            <button class="bridge-eye" id="eye-password" type="button">Show</button>
          </span>
        </label>
        <label>
          <span id="label-confirm">Confirm password</span>
          <span class="bridge-pass">
            <input id="confirm" type="password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" dir="ltr" />
            <button class="bridge-eye" id="eye-confirm" type="button">Show</button>
          </span>
        </label>
        <ul class="bridge-checks" id="checks"></ul>
        <label id="mfa-wrap" hidden>
          <span>Authenticator code</span>
          <input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" dir="ltr" />
          <span class="bridge-rules">This account uses an authenticator. Enter the current 6-digit code so the new password can be saved.</span>
        </label>
        <p id="error" class="bridge-error" hidden></p>
        <p id="status" class="bridge-status" hidden></p>
        <button class="btn" id="save" type="submit">Save password</button>
      </form>
      <p id="done" class="bridge-done" hidden>Password updated. Your password is changed. Close this page and sign in to Matra7 with the new password.</p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
    <script src="/config.js"></script>
    <script>
      (function () {
        var text = {
          title: 'Choose a new password',
          body: 'Type it twice. When this page says the password is updated, sign in to Matra7 with it.',
          show: 'Show',
          hide: 'Hide',
          save: 'Save password',
          saving: 'Saving...',
          length: '8–12 characters',
          upper: 'One uppercase letter',
          lower: 'One lowercase letter',
          number: 'One number',
          match: 'Passwords match',
          updatedTitle: 'Password updated',
          updatedBody: 'Your password is changed. Close this page and sign in to Matra7 with the new password.',
          needLinkTitle: 'Reset password',
          needLinkBody: 'Open Matra7, tap Forgot password, and use the link in the email. This page is where you choose the new password.',
          brokenTitle: 'Could not open this page',
          brokenBody: 'The reset page is not connected yet. Request a new link from the app later.',
          linkTitle: 'Could not open link',
          saveFailed: 'Could not update the password. Request a new link from the app.',
          notReady: 'This reset link is still opening. Wait a moment, then press Save password again.',
          needCode: 'Enter the 6-digit authenticator code, then save again.',
          badCode: 'That code is not valid. Use the current one in the authenticator app.',
        };

        var title = document.getElementById('title');
        var body = document.getElementById('body');
        var form = document.getElementById('form');
        var error = document.getElementById('error');
        var save = document.getElementById('save');
        var passwordInput = document.getElementById('password');
        var confirmInput = document.getElementById('confirm');
        var checks = document.getElementById('checks');
        var status = document.getElementById('status');
        var done = document.getElementById('done');
        var ready = false;
        var saving = false;
        var factorId = '';
        var cfg = window.MATRA7 || {};
        var createClient = window.supabase && window.supabase.createClient;
        var client = null;

        function eyeLabel(input) {
          return input.type === 'password' ? text.show : text.hide;
        }

        function checksFor(password, confirm) {
          return {
            length: password.length >= 8 && password.length <= 12,
            upper: /[A-Z]/.test(password),
            lower: /[a-z]/.test(password),
            number: /[0-9]/.test(password),
            match: password.length > 0 && password === confirm,
          };
        }

        function passwordOk() {
          var state = checksFor(passwordInput.value, confirmInput.value);
          return state.length && state.upper && state.lower && state.number && state.match;
        }

        function paintChecks() {
          var state = checksFor(passwordInput.value, confirmInput.value);
          var rows = [
            ['length', text.length],
            ['upper', text.upper],
            ['lower', text.lower],
            ['number', text.number],
            ['match', text.match],
          ];
          checks.innerHTML = rows
            .map(function (row) {
              return '<li class="' + (state[row[0]] ? 'ok' : '') + '">' + row[1] + '</li>';
            })
            .join('');
          if (!saving) save.textContent = text.save;
        }

        function showError(message) {
          status.hidden = true;
          error.hidden = false;
          error.textContent = message;
        }

        function showStatus(message) {
          error.hidden = true;
          status.hidden = false;
          status.textContent = message;
        }

        function showUpdated() {
          form.hidden = true;
          title.textContent = text.updatedTitle;
          body.textContent = text.updatedBody;
          done.hidden = false;
        }

        function wireEye(button, input) {
          button.addEventListener('click', function () {
            var hidden = input.type === 'password';
            input.type = hidden ? 'text' : 'password';
            button.textContent = hidden ? text.hide : text.show;
            input.focus();
          });
        }

        function readParams() {
          var params = new URLSearchParams(location.search);
          var hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
          hash.forEach(function (value, key) {
            params.set(key, value);
          });
          return params;
        }

        document.getElementById('eye-password').textContent = eyeLabel(passwordInput);
        document.getElementById('eye-confirm').textContent = eyeLabel(confirmInput);
        passwordInput.addEventListener('input', paintChecks);
        confirmInput.addEventListener('input', paintChecks);
        wireEye(document.getElementById('eye-password'), passwordInput);
        wireEye(document.getElementById('eye-confirm'), confirmInput);
        paintChecks();

        if (!createClient || !cfg.supabaseUrl || !cfg.supabaseAnonKey || String(cfg.supabaseUrl).indexOf('REPLACE') !== -1) {
          title.textContent = text.brokenTitle;
          body.textContent = text.brokenBody;
          return;
        }

        var params = readParams();
        var linkError = params.get('error_description') || params.get('error');
        if (linkError) {
          title.textContent = text.linkTitle;
          body.textContent = linkError;
          return;
        }

        var tokenHash = params.get('token_hash') || '';
        var accessToken = params.get('access_token') || '';
        var refreshToken = params.get('refresh_token') || '';
        var code = params.get('code') || '';
        var hasLink = Boolean(code || tokenHash || (accessToken && refreshToken));
        if (!hasLink) {
          title.textContent = text.needLinkTitle;
          body.textContent = text.needLinkBody;
          return;
        }

        client = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
          auth: {
            persistSession: true,
            autoRefreshToken: false,
            detectSessionInUrl: true,
            flowType: 'implicit',
            storageKey: 'matra7.reset.auth',
          },
        });

        function markReady(session) {
          if (!session || !session.user) return Promise.resolve(false);
          return client.auth.mfa
            .listFactors()
            .then(function (listed) {
              var factor = ((listed.data && listed.data.totp) || []).filter(function (item) {
                return item.status === 'verified';
              })[0];
              if (factor) {
                factorId = factor.id;
                document.getElementById('mfa-wrap').hidden = false;
              }
            })
            .catch(function () {})
            .then(function () {
              ready = true;
              status.hidden = true;
              paintChecks();
              return true;
            });
        }

        function openRecovery() {
          if (accessToken && refreshToken) {
            return client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
          }
          if (tokenHash) return client.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
          return client.auth.exchangeCodeForSession(code);
        }

        form.hidden = false;
        title.textContent = text.title;
        body.textContent = text.body;
        showStatus('Opening your reset link...');
        openRecovery()
          .then(function (result) {
            if (result.error) throw result.error;
            return client.auth.getSession();
          })
          .then(function (checked) {
            return markReady(checked.data && checked.data.session);
          })
          .then(function (ok) {
            if (!ok) throw new Error(text.saveFailed);
          })
          .catch(function (err) {
            ready = false;
            form.hidden = true;
            title.textContent = text.linkTitle;
            body.textContent = (err && err.message) || text.saveFailed;
          });

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          if (saving) return;
          if (!ready) {
            showError(text.notReady);
            return;
          }
          if (!passwordOk()) {
            showError('The password still needs every check above.');
            return;
          }
          saving = true;
          save.disabled = true;
          save.textContent = text.saving;
          showStatus('Saving your password...');
          client.auth
            .getSession()
            .then(function (current) {
              var session = current.data && current.data.session;
              if (!session || !session.user) throw new Error(text.saveFailed);
              if (!factorId) return null;
              var code = document.getElementById('mfaCode').value.replace(/\s/g, '');
              if (code.length < 6) throw new Error(text.needCode);
              return client.auth.mfa.challengeAndVerify({ factorId: factorId, code: code });
            })
            .then(function (verified) {
              if (verified && verified.error) throw verified.error;
              return client.auth.updateUser({ password: passwordInput.value });
            })
            .then(function (result) {
              if (!result || result.error || !result.data || !result.data.user) {
                throw (result && result.error) || new Error(text.saveFailed);
              }
              return client.auth.signOut({ scope: 'local' }).catch(function () {});
            })
            .then(function () {
              showUpdated();
            })
            .catch(function (err) {
              saving = false;
              save.disabled = false;
              paintChecks();
              showError((err && err.message) || text.saveFailed);
            });
        });
      })();
    </script>
  </body>
</html>

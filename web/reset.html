<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — Matra7</title>
    <link rel="icon" href="/assets/logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body class="bridge">
    <main class="bridge-card">
      <img class="logo" src="/assets/logo-mark.png" alt="Matra7" width="160" height="54" />
      <h1 id="title">Choose a new password</h1>
      <p id="body">Type it twice. When this page says the password is updated, sign in to Matra7 with it.</p>
      <form id="form" class="bridge-form" hidden>
        <p class="bridge-rules">8–12 characters, with an uppercase letter, a lowercase letter, and a number.</p>
        <label>
          New password
          <input id="password" type="password" autocomplete="new-password" dir="ltr" required />
        </label>
        <label>
          Confirm password
          <input id="confirm" type="password" autocomplete="new-password" dir="ltr" required />
        </label>
        <p id="error" class="bridge-error" hidden></p>
        <button class="btn" id="save" type="submit">Save password</button>
      </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
    <script src="/config.js"></script>
    <script>
      (function () {
        var title = document.getElementById('title');
        var body = document.getElementById('body');
        var form = document.getElementById('form');
        var error = document.getElementById('error');
        var save = document.getElementById('save');
        var cfg = window.MATRA7 || {};
        var createClient = window.supabase && window.supabase.createClient;

        function readParams() {
          var params = new URLSearchParams(location.search);
          var hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
          hash.forEach(function (value, key) {
            params.set(key, value);
          });
          return params;
        }

        function showError(message) {
          error.hidden = false;
          error.textContent = message;
        }

        function passwordOk(password, confirm) {
          return (
            password.length >= 8 &&
            password.length <= 12 &&
            /[A-Z]/.test(password) &&
            /[a-z]/.test(password) &&
            /[0-9]/.test(password) &&
            password === confirm
          );
        }

        function finish(message) {
          form.hidden = true;
          title.textContent = 'Password updated';
          body.textContent = message;
        }

        if (!createClient || !cfg.supabaseUrl || !cfg.supabaseAnonKey || String(cfg.supabaseUrl).indexOf('REPLACE') !== -1) {
          title.textContent = 'Could not open this page';
          body.textContent = 'The reset page is not connected yet. Request a new link from the app later.';
          return;
        }

        var client = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
          auth: { persistSession: true, autoRefreshToken: false, detectSessionInUrl: false },
        });
        var params = readParams();
        var linkError = params.get('error_description') || params.get('error');

        if (linkError) {
          title.textContent = 'Could not open link';
          body.textContent = linkError;
          return;
        }

        var hasLink = params.get('code') || (params.get('access_token') && params.get('refresh_token'));
        if (!hasLink) {
          title.textContent = 'Reset password';
          body.textContent = 'Open Matra7, tap Forgot password, and use the link in the email. This page is where you choose the new password.';
          return;
        }

        form.hidden = false;

        function openRecovery() {
          var code = params.get('code');
          if (code) return client.auth.exchangeCodeForSession(code);
          return client.auth.setSession({
            access_token: params.get('access_token'),
            refresh_token: params.get('refresh_token'),
          });
        }

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          error.hidden = true;
          var password = document.getElementById('password').value;
          var confirm = document.getElementById('confirm').value;
          if (!passwordOk(password, confirm)) {
            showError('Use 8–12 characters, with an uppercase letter, a lowercase letter, and a number. Both fields must match.');
            return;
          }
          save.disabled = true;
          openRecovery()
            .then(function (result) {
              if (result.error) throw result.error;
              return client.auth.updateUser({ password: password });
            })
            .then(function (result) {
              if (result.error) throw result.error;
              return client.auth.signOut();
            })
            .then(function () {
              finish('Your password is updated. Close this page and sign in to Matra7 with the new password.');
            })
            .catch(function (err) {
              save.disabled = false;
              showError((err && err.message) || 'Could not update the password. Request a new link from the app.');
            });
        });
      })();
    </script>
  </body>
</html>

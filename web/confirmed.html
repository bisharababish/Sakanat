<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تم تأكيد بريدك — Matra7</title>
    <link rel="icon" href="/assets/logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="centered">
    <main class="card">
      <img src="/assets/logo-mark.png" alt="Matra7" width="160" height="54" style="display:block;margin:0 auto 18px;height:54px;width:auto" />
      <h1 id="title">تم تأكيد بريدك</h1>
      <p id="body">حسابك صار جاهز. ارجع لتطبيق مَطْرَح وسجّل الدخول بنفس الإيميل وكلمة المرور.</p>
      <a class="btn" id="open" href="sakanat://confirmed">فتح التطبيق</a>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(location.search + location.hash.replace('#', '&'));
        if (params.get('error') || params.get('error_description')) {
          document.getElementById('title').textContent = 'ما قدرنا نأكد البريد';
          document.getElementById('body').textContent =
            params.get('error_description') || 'جرب تسجّل الدخول أو اطلب رمز جديد من التطبيق.';
          return;
        }
        setTimeout(function () {
          location.href = 'sakanat://confirmed';
        }, 1100);
      })();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email confirmed — Matra7</title>
    <link rel="icon" href="/assets/logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body class="bridge">
    <main class="bridge-card">
      <img class="logo" src="/assets/logo-mark.png" alt="Matra7" width="160" height="54" />
      <h1 id="title">Email confirmed</h1>
      <p id="body">Your account is ready. Open Matra7 and sign in with the same email and password.</p>
      <a class="btn" id="open" href="sakanat://confirmed">Open the app</a>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(location.search + location.hash.replace('#', '&'));
        if (params.get('error') || params.get('error_description')) {
          document.getElementById('title').textContent = 'Could not confirm email';
          document.getElementById('body').textContent =
            params.get('error_description') || 'Try signing in, or request a new code from the app.';
          return;
        }
        setTimeout(function () {
          location.href = 'sakanat://confirmed';
        }, 1100);
      })();
    </script>
  </body>
</html>
